/* =====================  src/js/02-masks.js  ===================== */
/* =============================================================================
 * 02-masks.js — Mascaras de digitacao
 * Formatam o texto automaticamente enquanto o usuario digita.
 * - maskCEP:   00000000      -> 00000-000
 * - maskPhone: 11999998888   -> (11) 99999-8888  (celular ou fixo)
 * ============================================================================= */

const onlyDigits = (v) => (v || '').replace(/\D/g, '');
function maskCEP(v) {
  const d = onlyDigits(v).slice(0, 8);
  return d.length > 5 ? d.slice(0, 5) + '-' + d.slice(5) : d;
}
function maskPhone(v) {
  const d = onlyDigits(v).slice(0, 11);
  if (d.length <= 2) return d ? '(' + d : '';
  if (d.length <= 6) return '(' + d.slice(0, 2) + ') ' + d.slice(2);
  if (d.length <= 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
  return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
}


/* =====================  src/js/03-images.js  ===================== */
/* =============================================================================
 * 03-images.js — Imagens
 * - resizeImage: reduz a foto enviada (ate ~1000px, JPEG) e devolve em base64,
 *   mantendo o backup leve.
 * - productPhotos: le a lista de fotos de um produto (compativel com backups
 *   antigos que tinham apenas o campo "photo").
 * ============================================================================= */

function resizeImage(file, maxDim = 1000, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width >= height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        try { resolve(canvas.toDataURL('image/jpeg', quality)); } catch (err) { reject(err); }
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
/* Lista de fotos do produto, com compatibilidade para backups antigos (campo "photo") */
function productPhotos(p) {
  if (p && Array.isArray(p.photos)) return p.photos;
  if (p && p.photo) return [p.photo];
  return [];
}


/* =====================  src/js/04-storage.js  ===================== */
/* =============================================================================
 * 04-storage.js — Persistencia local (os dados nunca se perdem)
 * Salva tudo no IndexedDB do navegador e, como copia de seguranca, tambem no
 * localStorage. Ao abrir, le primeiro do IndexedDB; se nao houver, do localStorage.
 *   Storage.load()  -> recupera o estado salvo
 *   Storage.save(s) -> grava o estado atual
 * ============================================================================= */

const DB_NAME = 'dgames', STORE = 'kv', KEY = 'state', LS_KEY = 'dgames_state';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(STORE)) req.result.createObjectStore(STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const rq = db.transaction(STORE, 'readonly').objectStore(STORE).get(key);
    rq.onsuccess = () => resolve(rq.result); rq.onerror = () => reject(rq.error);
  });
}
async function idbSet(key, val) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(val, key);
    tx.oncomplete = () => resolve(); tx.onerror = () => reject(tx.error);
  });
}
// Modo demo (build com --demo): chave separada no localStorage, sem IndexedDB.
// Assim a demo nunca le nem sobrescreve os dados reais da loja.
const IS_DEMO = typeof DGAMES_DEMO !== 'undefined' && DGAMES_DEMO;
const DEMO_LS_KEY = 'dgames_demo_state';

const DemoStorage = {
  async load() {
    try { const s = localStorage.getItem(DEMO_LS_KEY); if (s) return JSON.parse(s); } catch (e) {}
    return JSON.parse(JSON.stringify(DEMO_SEED));
  },
  async save(state) {
    try { localStorage.setItem(DEMO_LS_KEY, JSON.stringify(state)); } catch (e) {}
  },
  reset() {
    try { localStorage.removeItem(DEMO_LS_KEY); } catch (e) {}
    return JSON.parse(JSON.stringify(DEMO_SEED));
  },
};

const Storage = IS_DEMO ? DemoStorage : {
  async load() {
    try { const v = await idbGet(KEY); if (v) return v; } catch (e) {}
    try { const s = localStorage.getItem(LS_KEY); if (s) return JSON.parse(s); } catch (e) {}
    return null;
  },
  async save(state) {
    let ok = false;
    try { await idbSet(KEY, state); ok = true; } catch (e) {}
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { if (!ok) throw e; }
  }
};

/* =====================  src/js/07-customer-fields.js  ===================== */
/* =============================================================================
 * 07-customer-fields.js — Ficha de contato (cliente OU fornecedor)
 * - CustomerFields: os 5 campos (nome, endereco, CEP, telefone, e-mail). A prop
 *   "who" so muda o texto de exemplo; "prefix" separa os erros (ex.: s_ / c_).
 * - validateCustomer: valida que os 5 campos foram preenchidos (e o e-mail valido).
 * ============================================================================= */

function CustomerFields({ f, setF, errors, prefix = '', who = 'cliente' }) {
  const e = (k) => errors[prefix + k];
  return (
    <>
      <div className="sm:col-span-2">
        <Field label="Nome completo" required error={e('name')}>
          <input className={inputCls(e('name'))} value={f.name} onChange={(ev) => setF((s) => ({ ...s, name: ev.target.value }))} placeholder={'Nome do ' + who} />
        </Field>
      </div>
      <div className="sm:col-span-2">
        <Field label="Endereço completo" required error={e('address')}>
          <input className={inputCls(e('address'))} value={f.address} onChange={(ev) => setF((s) => ({ ...s, address: ev.target.value }))} placeholder="Rua, número, bairro, cidade/UF" />
        </Field>
      </div>
      <Field label="CEP" required error={e('cep')}>
        <input className={inputCls(e('cep'))} value={f.cep} onChange={(ev) => setF((s) => ({ ...s, cep: maskCEP(ev.target.value) }))} placeholder="00000-000" inputMode="numeric" />
      </Field>
      <Field label="Telefone" required error={e('phone')}>
        <input className={inputCls(e('phone'))} value={f.phone} onChange={(ev) => setF((s) => ({ ...s, phone: maskPhone(ev.target.value) }))} placeholder="(00) 00000-0000" inputMode="tel" />
      </Field>
      <div className="sm:col-span-2">
        <Field label="E-mail" required error={e('email')}>
          <input className={inputCls(e('email'))} value={f.email} onChange={(ev) => setF((s) => ({ ...s, email: ev.target.value }))} placeholder={who + '@email.com'} inputMode="email" />
        </Field>
      </div>
    </>
  );
}

function validateCustomer(f, prefix = '') {
  const errs = {};
  if (!f.name.trim()) errs[prefix + 'name'] = 'Obrigatório';
  if (!f.address.trim()) errs[prefix + 'address'] = 'Obrigatório';
  if (!f.cep.trim()) errs[prefix + 'cep'] = 'Obrigatório';
  if (!f.phone.trim()) errs[prefix + 'phone'] = 'Obrigatório';
  if (!f.email.trim()) errs[prefix + 'email'] = 'Obrigatório';
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim())) errs[prefix + 'email'] = 'E-mail inválido';
  return errs;
}


/* =====================  src/js/08-photo-uploader.js  ===================== */
/* =============================================================================
 * 08-photo-uploader.js — Envio de fotos (ate 5)
 * Mostra as miniaturas, marca a 1a como PRINCIPAL, permite remover e bloqueia
 * acima do limite. Cada imagem passa por resizeImage antes de ser guardada.
 * ============================================================================= */

function PhotoUploader({ photos, setPhotos, max = 5, toast }) {
  const [busy, setBusy] = useState(false);
  const inputRef = useRef(null);
  async function onFiles(e) {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    const room = max - photos.length;
    if (room <= 0) { toast(`Limite de ${max} fotos atingido.`, 'error'); if (inputRef.current) inputRef.current.value = ''; return; }
    setBusy(true);
    try {
      const imgs = [];
      for (const f of files.slice(0, room)) { if (f.type.startsWith('image/')) imgs.push(await resizeImage(f)); }
      setPhotos([...photos, ...imgs].slice(0, max));
      if (files.length > room) toast(`Adicionadas ${room} foto(s) — máximo de ${max}.`, 'info');
    } catch (err) { toast('Não foi possível processar alguma imagem.', 'error'); }
    finally { setBusy(false); if (inputRef.current) inputRef.current.value = ''; }
  }
  const removeAt = (i) => setPhotos(photos.filter((_, idx) => idx !== i));
  return (
    <div>
      <span className="block text-sm font-semibold text-slate-200 mb-1">Fotos <span className="font-normal text-slate-500">(até {max})</span></span>
      <div className="grid grid-cols-3 sm:grid-cols-5 gap-2">
        {photos.map((src, i) => (
          <div key={i} className="relative aspect-square rounded-lg overflow-hidden ring-1 ring-white/10 bg-black/30">
            <img src={src} alt={'foto ' + (i + 1)} className="h-full w-full object-cover" />
            {i === 0 && <span className="absolute bottom-1 left-1 text-[8px] font-bold bg-arcade-pink text-white px-1.5 py-0.5 rounded">PRINCIPAL</span>}
            <button type="button" onClick={() => removeAt(i)} title="Remover foto"
              className="absolute top-1 right-1 h-6 w-6 grid place-items-center rounded-full bg-black/65 text-white hover:bg-rose-600"><Ic.close className="h-3.5 w-3.5" /></button>
          </div>
        ))}
        {photos.length < max && (
          <label className="aspect-square rounded-lg border-2 border-dashed border-white/20 bg-white/5 grid place-items-center cursor-pointer text-slate-400 hover:text-arcade-pink hover:border-arcade-pink/50 text-center">
            <span>
              <Ic.image className="h-6 w-6 mx-auto mb-1" />
              <span className="block text-[11px] font-medium">{busy ? '…' : 'Adicionar'}</span>
            </span>
            <input ref={inputRef} type="file" accept="image/*" multiple className="hidden" onChange={onFiles} />
          </label>
        )}
      </div>
    </div>
  );
}

/* =============================================================================
 * 10-product-form.js — Formulario "Cadastrar produto"
 * Controla os campos, valida (nome, valores e fornecedor obrigatorios), monta o
 * objeto do produto e chama onAdd. Mostra o "Lucro previsto" em tempo real.
 * ============================================================================= */

function ProductForm({ onAdd, toast }) {
  const emptyCore = { name: '', description: '', category: 'Game', buyPrice: '', salePrice: '', unlocked: false };
  const emptySup = { name: '', address: '', cep: '', phone: '', email: '' };
  const [v, setV] = useState(emptyCore);
  const [photos, setPhotos] = useState([]);
  const [supplier, setSupplier] = useState(emptySup);
  const [errors, setErrors] = useState({});
  const set = (k, val) => setV((s) => ({ ...s, [k]: val }));
  function reset() { setV(emptyCore); setPhotos([]); setSupplier(emptySup); setErrors({}); }

  function submit(e) {
    e.preventDefault();
    const errs = {};
    if (!v.name.trim()) errs.name = 'Informe o nome do produto.';
    if (v.buyPrice === '' || isNaN(Number(v.buyPrice)) || Number(v.buyPrice) < 0) errs.buyPrice = 'Valor inválido.';
    if (v.salePrice === '' || isNaN(Number(v.salePrice)) || Number(v.salePrice) < 0) errs.salePrice = 'Valor inválido.';
    Object.assign(errs, validateCustomer(supplier, 's_'));
    setErrors(errs);
    if (Object.keys(errs).length) { toast('Confira os campos destacados.', 'error'); return; }
    onAdd({
      id: uid(), name: v.name.trim(), description: v.description.trim(), category: v.category,
      photos: photos.slice(0, 5), buyPrice: Number(v.buyPrice), salePrice: Number(v.salePrice),
      unlocked: v.category === 'Console' ? v.unlocked : undefined,
      supplier: { name: supplier.name.trim(), address: supplier.address.trim(), cep: supplier.cep.trim(), phone: supplier.phone.trim(), email: supplier.email.trim() },
      status: 'stock', createdAt: new Date().toISOString(),
    });
    reset();
    toast('Produto adicionado ao estoque! ⭐', 'success');
  }

  const margin = (Number(v.salePrice) || 0) - (Number(v.buyPrice) || 0);

  return (
    <form onSubmit={submit} className="rounded-2xl panel p-5">
      <SectionTitle icon={<Ic.plus className="h-5 w-5" />} kicker="Cadastrar produto" />
      <ProductFields v={v} set={set} errors={errors} photos={photos} setPhotos={setPhotos} supplier={supplier} setSupplier={setSupplier} toast={toast} />
      <div className="mt-5 flex flex-wrap items-center justify-between gap-3">
        <div className="text-sm">
          <span className="text-slate-400">Lucro previsto: </span>
          <span className={`font-display font-bold ${margin >= 0 ? 'text-arcade-green glow-green' : 'text-rose-400'}`}>{fmt(margin)}</span>
        </div>
        <div className="flex gap-2">
          <button type="button" onClick={reset} className="rounded-xl px-4 py-2.5 text-sm font-semibold text-slate-300 hover:bg-white/10">Limpar</button>
          <button type="submit" className="btn-pink inline-flex items-center gap-2 rounded-xl px-5 py-2.5 text-sm font-bold text-white active:scale-[.98] transition">
            <Ic.plus className="h-4 w-4" /> Salvar produto
          </button>
        </div>
      </div>
    </form>
  );
}

/* =====================  src/js/12-modal.js  ===================== */
/* =============================================================================
 * 12-modal.js — Janela (modal) generica
 * Caixa central escura com titulo, botao de fechar e fechamento por ESC ou
 * clique fora. Serve de base para a Ficha de Venda, Edicao, Config e Importacao.
 * ============================================================================= */

function Modal({ title, onClose, children, maxW = 'max-w-lg' }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  return (
    <div className="fixed inset-0 z-40 grid place-items-center p-4 bg-black/70 backdrop-blur-sm" onMouseDown={onClose}>
      <div className={`w-full ${maxW} rounded-2xl bg-arcade-panel ring-1 ring-arcade-pink/30 shadow-2xl anim-pop max-h-[92vh] overflow-y-auto`}
        style={{ boxShadow: '0 0 40px rgba(255,30,128,.25)' }} onMouseDown={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between px-5 py-4 border-b border-white/10 sticky top-0 bg-arcade-panel rounded-t-2xl z-10">
          <h3 className="font-display font-bold text-white tracking-wide">{title}</h3>
          <button onClick={onClose} className="h-8 w-8 grid place-items-center rounded-full text-slate-400 hover:bg-white/10"><Ic.close className="h-5 w-5" /></button>
        </div>
        <div className="p-5">{children}</div>
      </div>
    </div>
  );
}

/* =====================  src/js/14-edit-modal.js  ===================== */
/* =============================================================================
 * 14-edit-modal.js — Editar produto (estoque e vendidos)
 * Reaproveita ProductFields. Se o item ja foi vendido, mostra tambem a ficha do
 * CLIENTE para correcao. Ao salvar, devolve um "patch" com as alteracoes.
 * ============================================================================= */

function EditModal({ product, onSave, onClose, toast }) {
  const isSold = product.status === 'sold';
  const [v, setV] = useState({
    name: product.name, description: product.description || '', category: product.category,
    buyPrice: String(product.buyPrice), salePrice: String(product.salePrice), unlocked: !!product.unlocked,
  });
  const [photos, setPhotos] = useState(productPhotos(product));
  const s0 = product.supplier || {};
  const [supplier, setSupplier] = useState({ name: s0.name || '', address: s0.address || '', cep: s0.cep || '', phone: s0.phone || '', email: s0.email || '' });
  const c0 = (product.sale && product.sale.customer) || {};
  const [f, setF] = useState({ name: c0.name || '', address: c0.address || '', cep: c0.cep || '', phone: c0.phone || '', email: c0.email || '' });
  const [errors, setErrors] = useState({});
  const set = (k, val) => setV((s) => ({ ...s, [k]: val }));

  function submit(e) {
    e.preventDefault();
    const errs = {};
    if (!v.name.trim()) errs.name = 'Informe o nome do produto.';
    if (v.buyPrice === '' || isNaN(Number(v.buyPrice)) || Number(v.buyPrice) < 0) errs.buyPrice = 'Valor inválido.';
    if (v.salePrice === '' || isNaN(Number(v.salePrice)) || Number(v.salePrice) < 0) errs.salePrice = 'Valor inválido.';
    Object.assign(errs, validateCustomer(supplier, 's_'));
    if (isSold) Object.assign(errs, validateCustomer(f, 'c_'));
    setErrors(errs);
    if (Object.keys(errs).length) { toast('Confira os campos destacados.', 'error'); return; }

    const patch = {
      name: v.name.trim(), description: v.description.trim(), category: v.category, photo: undefined,
      photos: photos.slice(0, 5), buyPrice: Number(v.buyPrice), salePrice: Number(v.salePrice),
      unlocked: v.category === 'Console' ? v.unlocked : undefined,
      supplier: { name: supplier.name.trim(), address: supplier.address.trim(), cep: supplier.cep.trim(), phone: supplier.phone.trim(), email: supplier.email.trim() },
    };
    if (isSold) {
      patch.sale = { ...(product.sale || {}), customer: { name: f.name.trim(), address: f.address.trim(), cep: f.cep.trim(), phone: f.phone.trim(), email: f.email.trim() } };
    }
    onSave(product.id, patch);
  }

  return (
    <Modal title="✏️ Editar produto" onClose={onClose} maxW="max-w-2xl">
      <form onSubmit={submit}>
        <ProductFields v={v} set={set} errors={errors} photos={photos} setPhotos={setPhotos} supplier={supplier} setSupplier={setSupplier} toast={toast} />

        {isSold && (
          <div className="mt-5 border-t border-white/10 pt-4">
            <div className="flex items-center gap-1.5 font-pixel text-[8px] tracking-widest text-arcade-yellow mb-3">
              <Ic.user className="h-3.5 w-3.5" /> CLIENTE — PARA QUEM VOCÊ VENDEU
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <CustomerFields f={f} setF={setF} errors={errors} prefix="c_" who="cliente" />
            </div>
          </div>
        )}

        <div className="mt-5 flex justify-end gap-2">
          <button type="button" onClick={onClose} className="rounded-xl px-4 py-2.5 text-sm font-semibold text-slate-300 hover:bg-white/10">Cancelar</button>
          <button type="submit" className="btn-pink inline-flex items-center gap-2 rounded-xl px-5 py-2.5 text-sm font-bold text-white active:scale-[.98] transition">
            <Ic.check className="h-4 w-4" /> Salvar alterações
          </button>
        </div>
      </form>
    </Modal>
  );
}

/* =====================  src/js/18-app.js  ===================== */
/* =============================================================================
 * 18-app.js — Componente principal (cola tudo)
 * Guarda o estado (lista de produtos, aba ativa, modais abertos, busca),
 * carrega/salva no Storage, e contem as acoes: adicionar, editar, excluir,
 * vender, devolver ao estoque, exportar/importar backup e limpar tudo.
 * No fim, renderiza o App na pagina.
 * ============================================================================= */
function App() {
  // ----- Estado -----
  const [state, setState] = useState({ products: [] }); // dados (produtos)
  const [loaded, setLoaded] = useState(false);          // ja carregou do disco?
  const [tab, setTab] = useState('estoque');            // aba ativa
  const [toasts, setToasts] = useState([]);             // avisos na tela
  const [saleTarget, setSaleTarget] = useState(null);   // produto sendo vendido
  const [editTarget, setEditTarget] = useState(null);   // produto sendo editado
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [importData, setImportData] = useState(null);   // backup aguardando confirmacao
  const [query, setQuery] = useState('');               // termo de busca

  // ----- Carregar ao abrir / salvar a cada mudanca -----
  useEffect(() => {
    Storage.load().then((s) => { if (s && Array.isArray(s.products)) setState(s); }).finally(() => setLoaded(true));
  }, []);

  useEffect(() => {
    if (!loaded) return; // nao salva antes do primeiro carregamento
    Storage.save(state).catch(() => toast('Erro ao salvar — armazenamento pode estar cheio.', 'error'));
  }, [state, loaded]);

  // Mostra um aviso que some sozinho apos ~3s
  function toast(msg, type = 'info') {
    const id = uid();
    setToasts((t) => [...t, { id, msg, type }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3200);
  }

  // ----- Acoes sobre produtos -----
  const addProduct = (p) => setState((s) => ({ ...s, products: [p, ...s.products] }));
  const updateProduct = (id, patch) => setState((s) => ({ ...s, products: s.products.map((p) => p.id === id ? { ...p, ...patch } : p) }));

  function deleteProduct(p) {
    if (!window.confirm(`Excluir "${p.name}"? Esta ação não pode ser desfeita.`)) return;
    setState((s) => ({ ...s, products: s.products.filter((x) => x.id !== p.id) }));
    toast('Produto excluído.', 'info');
  }
  const toggleUnlocked = (id) => setState((s) => ({ ...s, products: s.products.map((p) => p.id === id ? { ...p, unlocked: !p.unlocked } : p) }));

  function saveEdit(id, patch) { updateProduct(id, patch); setEditTarget(null); toast('Produto atualizado! ⭐', 'success'); }

  // ----- Fluxo de venda -----
  function requestSale(p) { setSaleTarget(p); setTab('vendidos'); } // marca vendido -> vai p/ Vendidos e abre a ficha
  function confirmSale(customer) {
    updateProduct(saleTarget.id, { status: 'sold', sale: { soldAt: new Date().toISOString(), customer } });
    setSaleTarget(null);
    toast('Venda registrada com sucesso! 🏆', 'success');
  }
  function cancelSale() { setSaleTarget(null); setTab('estoque'); toast('Venda cancelada.', 'info'); }

  function returnToStock(p) {
    if (!window.confirm(`Devolver "${p.name}" ao estoque? Os dados do cliente serão removidos.`)) return;
    updateProduct(p.id, { status: 'stock', sale: undefined });
    toast('Produto devolvido ao estoque.', 'info');
  }

  // ----- Backup (exportar / importar) -----
  function exportBackup() {
    const payload = { app: 'DGAMES', version: 1, exportedAt: new Date().toISOString(), products: state.products };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `dgames-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    toast('Backup exportado!', 'success');
  }

  function pickImport(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        const products = Array.isArray(data) ? data : data.products;
        if (!Array.isArray(products)) throw new Error('formato');
        setImportData(data); setSettingsOpen(false);
      } catch (err) { toast('Arquivo inválido — não é um backup do D GAMES.', 'error'); }
    };
    reader.onerror = () => toast('Não foi possível ler o arquivo.', 'error');
    reader.readAsText(file);
  }

  function applyImport(mode, products) {
    // Normaliza cada produto do backup (preenche campos novos / compatibiliza antigos)
    const clean = products.map((p) => ({
      id: p.id || uid(), name: p.name || 'Sem nome', description: p.description || '',
      category: CATEGORIES.includes(p.category) ? p.category : 'Game',
      photos: productPhotos(p).slice(0, 5), buyPrice: Number(p.buyPrice) || 0, salePrice: Number(p.salePrice) || 0,
      unlocked: p.category === 'Console' ? !!p.unlocked : undefined,
      supplier: p.supplier || {},
      status: p.status === 'sold' ? 'sold' : 'stock', sale: p.sale || undefined,
      createdAt: p.createdAt || new Date().toISOString(),
    }));
    if (mode === 'overwrite') {
      setState({ products: clean });
      toast(`Backup importado (substituição): ${clean.length} item(ns).`, 'success');
    } else {
      // Mesclar: adiciona apenas os que ainda nao existem (por id)
      const ids = new Set(state.products.map((p) => p.id));
      const added = clean.filter((p) => !ids.has(p.id));
      setState((s) => ({ ...s, products: [...s.products, ...added] }));
      toast(`Backup mesclado: ${added.length} novo(s) item(ns).`, 'success');
    }
    setImportData(null);
  }

  function clearAll() {
    if (!window.confirm('APAGAR TODOS OS DADOS deste navegador? Exporte um backup antes. Esta ação não pode ser desfeita.')) return;
    setState({ products: [] }); setSettingsOpen(false);
    toast('Todos os dados foram apagados.', 'info');
  }

  // ----- Calculos derivados -----
  // Estatisticas em UMA passada so (memoizadas: so recalculam quando os produtos mudam).
  const stats = useMemo(() => {
    let stockCount = 0, soldCount = 0, invested = 0, potential = 0, revenue = 0, totalProfit = 0;
    for (const p of state.products) {
      const buy = Number(p.buyPrice) || 0;
      const sale = Number(p.salePrice) || 0;
      if (p.status === 'sold') { soldCount++; revenue += sale; totalProfit += sale - buy; }
      else { stockCount++; invested += buy; potential += sale - buy; }
    }
    return { stockCount, soldCount, invested, potential, revenue, totalProfit };
  }, [state.products]);

  // Listas filtradas pela busca (memoizadas por produtos + termo de busca).
  const q = query.trim().toLowerCase();
  const { stock, sold } = useMemo(() => {
    const matches = (p) => !q || p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
    return {
      stock: state.products.filter((p) => p.status !== 'sold' && matches(p)),
      sold: state.products.filter((p) => p.status === 'sold' && matches(p)),
    };
  }, [state.products, q]);

  if (!loaded) return <div className="min-h-screen grid place-items-center font-pixel text-arcade-pink text-xs">CARREGANDO D GAMES…</div>;

  // Botao de aba (Estoque / Vendidos) com contador
  const TabBtn = ({ id, label, count }) => (
    <button onClick={() => setTab(id)}
      className={`relative flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-display font-bold transition ${tab === id ? 'bg-arcade-pink text-white shadow-[0_0_18px_rgba(255,30,128,.5)]' : 'text-slate-300 hover:text-white'}`}>
      {label}
      <span className={`inline-grid place-items-center min-w-[1.25rem] h-5 px-1 rounded-full text-[11px] font-bold ${tab === id ? 'bg-white/25 text-white' : 'bg-white/10 text-slate-300'}`}>{count}</span>
    </button>
  );

  return (
    <div className="min-h-screen pb-16">
      {IS_DEMO && (
        <div className="bg-arcade-yellow text-arcade-bg text-xs sm:text-sm font-semibold px-4 py-2 flex flex-wrap items-center justify-center gap-x-3 gap-y-1 text-center">
          <span>Modo demonstração: todos os produtos, fornecedores e clientes são fictícios. Suas mudanças ficam só neste navegador.</span>
          <button onClick={() => { setState(DemoStorage.reset()); toast('Demo restaurada.', 'info'); }}
            className="underline underline-offset-2 font-bold">Restaurar demo</button>
        </div>
      )}
      {/* Cabecalho fixo: logo, abas e acoes */}
      <header className="sticky top-0 z-30 bg-arcade-bg/90 backdrop-blur border-b border-arcade-pink/20">
        <div className="mx-auto max-w-6xl px-4 py-3 flex flex-wrap items-center gap-3 justify-between">
          <Logo />
          <nav className="order-3 sm:order-2 w-full sm:w-auto flex items-center gap-1 rounded-xl bg-white/5 ring-1 ring-white/10 p-1">
            <TabBtn id="estoque" label="Estoque" count={stats.stockCount} />
            <TabBtn id="vendidos" label="Vendidos" count={stats.soldCount} />
          </nav>
          <div className="order-2 sm:order-3 flex items-center gap-2">
            <button onClick={exportBackup} title="Exportar backup"
              className="hidden sm:inline-flex items-center gap-2 rounded-lg bg-white/5 ring-1 ring-white/10 px-3 py-2 text-sm font-semibold text-white hover:bg-white/15">
              <Ic.down className="h-4 w-4" /> Backup
            </button>
            <button onClick={() => setSettingsOpen(true)} title="Configurações"
              className="inline-flex items-center justify-center h-10 w-10 rounded-lg bg-white/5 ring-1 ring-white/10 text-white hover:bg-white/15">
              <Ic.gear className="h-5 w-5" />
            </button>
          </div>
        </div>
      </header>

      <main className="mx-auto max-w-6xl px-4 mt-6">
        {/* Busca por nome ou categoria */}
        <div className="mb-5">
          <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="🔎 Buscar por nome ou categoria…"
            className="w-full rounded-xl border border-white/15 bg-white/5 text-white px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-arcade-pink/60 focus:border-arcade-pink" />
        </div>

        {/* ===== ABA ESTOQUE ===== */}
        {tab === 'estoque' && (
          <div className="space-y-6">
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
              <StatCard label="Itens em estoque" value={stats.stockCount} accent="text-arcade-pink" glow="glow-pink" />
              <StatCard label="Investido" value={fmt(stats.invested)} />
              <StatCard label="Lucro potencial" value={fmt(stats.potential)} accent="text-arcade-green" glow="glow-green" />
              <StatCard label="Vendas feitas" value={stats.soldCount} sub={`${fmt(stats.totalProfit)} de lucro`} accent="text-arcade-yellow" glow="glow-yellow" />
            </div>

            <ProductForm onAdd={addProduct} toast={toast} />

            <div>
              <SectionTitle icon={<Ic.box className="h-5 w-5" />} kicker="Produtos em estoque" />
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                {stock.length === 0
                  ? <EmptyState icon={<Ic.box className="h-7 w-7" />} title={q ? 'Nenhum resultado' : 'Estoque vazio'} text={q ? 'Tente outro termo de busca.' : 'Cadastre seu primeiro produto no formulário acima. ⭐'} />
                  : stock.map((p) => <ProductCard key={p.id} p={p} onDelete={deleteProduct} onEdit={setEditTarget} onToggleUnlocked={toggleUnlocked} onSell={requestSale} />)}
              </div>
            </div>
          </div>
        )}

        {/* ===== ABA VENDIDOS ===== */}
        {tab === 'vendidos' && (
          <div className="space-y-6">
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <StatCard label="Total de vendas" value={stats.soldCount} accent="text-arcade-pink" glow="glow-pink" />
              <StatCard label="Faturamento" value={fmt(stats.revenue)} />
              <div className="rounded-2xl p-4 text-arcade-bg" style={{ background: 'linear-gradient(135deg,#00E59B,#00b37a)', boxShadow: '0 0 28px rgba(0,229,155,.4)' }}>
                <div className="font-pixel text-[7px] tracking-widest uppercase opacity-80">Lucro total acumulado</div>
                <div className="mt-2 font-display text-2xl font-extrabold">{fmt(stats.totalProfit)}</div>
                <div className="text-xs opacity-80 mt-0.5">soma de todas as vendas 🏆</div>
              </div>
            </div>

            <div>
              <SectionTitle icon={<Ic.cart className="h-5 w-5" />} kicker="Produtos vendidos" color="text-arcade-green" />
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                {sold.length === 0
                  ? <EmptyState icon={<Ic.cart className="h-7 w-7" />} title={q ? 'Nenhum resultado' : 'Nenhuma venda ainda'} text={q ? 'Tente outro termo de busca.' : 'Marque um produto como "vendido" na aba Estoque para registrar a venda.'} />
                  : sold.map((p) => <SoldCard key={p.id} p={p} onDelete={deleteProduct} onEdit={setEditTarget} onReturn={returnToStock} />)}
              </div>
            </div>
          </div>
        )}
      </main>

      {/* Modais (so aparecem quando ha algo para mostrar) */}
      {saleTarget && <SaleModal product={saleTarget} onConfirm={confirmSale} onCancel={cancelSale} />}
      {editTarget && <EditModal product={editTarget} onSave={saveEdit} onClose={() => setEditTarget(null)} toast={toast} />}
      {settingsOpen && <SettingsModal counts={{ stock: stats.stockCount, sold: stats.soldCount }} onExport={exportBackup} onPickImport={pickImport} onClearAll={clearAll} onClose={() => setSettingsOpen(false)} />}
      {importData && <ImportModal data={importData} onApply={applyImport} onCancel={() => setImportData(null)} />}

      <Toasts items={toasts} />

      <footer className="mx-auto max-w-6xl px-4 mt-10 text-center text-xs text-slate-500">
        🏆 D GAMES · Console Clássico, Valor de Verdade! · seus dados ficam neste navegador — faça backups regularmente.
      </footer>
    </div>
  );
}

// Monta o aplicativo dentro da <div id="root"> da pagina.
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>

  <!-- Bootstrap: compila o JSX com runtime "classic" (React.createElement),
       evitando os imports automaticos que quebram em script comum. -->
  <script>
    (function () {
      try {
        var src = document.getElementById('dgames-src').textContent;
        var compiled = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
        var s = document.createElement('script');
        s.textContent = compiled;
        document.body.appendChild(s);
      } catch (err) {
        document.getElementById('root').innerHTML =
          '<div style="max-width:640px;margin:48px auto;font-family:sans-serif;color:#FF1E80">' +
          '<h2>Erro ao iniciar o D GAMES</h2><pre style="white-space:pre-wrap">' +
          String(err) + '</pre><p>Verifique sua conexão com a internet (o sistema carrega React e Tailwind na primeira vez).</p></div>';
        console.error(err);
      }
    })();
  </script>
</body>
</html>
